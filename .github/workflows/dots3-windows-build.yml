name: Build Dots3 Windows Installer

on:
  push:
    branches:
      - dots3-desktop-build
    paths:
      - 'tools/dots3-desktop/**'
      - '.github/workflows/dots3-windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/dots3-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Generate application icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw, ImageFont
          img=Image.new('RGBA',(256,256),(20,24,32,255))
          d=ImageDraw.Draw(img)
          d.ellipse((34,34,222,222), fill=(85,92,255,255))
          d.ellipse((76,76,180,180), fill=(20,24,32,255))
          d.ellipse((104,104,152,152), fill=(255,255,255,255))
          img.save('dots3.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Dots3Desktop --icon dots3.ico --add-data "dots3.ico;." --collect-all keyring --collect-all keyring.backends --collect-all ddgs app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Dots3Desktop.exe")) { throw "Portable EXE was not created" }
          if (!(Test-Path "installer-output\Dots3Desktop-Setup.exe")) { throw "Installer was not created" }
          Get-Item "dist\Dots3Desktop.exe", "installer-output\Dots3Desktop-Setup.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dots3Desktop-Windows-Installer
          path: tools/dots3-desktop/installer-output/Dots3Desktop-Setup.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dots3Desktop-Windows-Portable
          path: tools/dots3-desktop/dist/Dots3Desktop.exe
          if-no-files-found: error
