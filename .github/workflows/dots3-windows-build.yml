name: Build Dots3 Windows EXE

on:
  push:
    branches:
      - dots3-desktop-build
    paths:
      - 'tools/dots3-desktop/**'
      - '.github/workflows/dots3-windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/dots3-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Dots3Desktop --collect-all keyring --collect-all keyring.backends --collect-all ddgs app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Dots3Desktop.exe")) { throw "Dots3Desktop.exe was not created" }
          Get-Item "dist\Dots3Desktop.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dots3Desktop-Windows-EXE
          path: tools/dots3-desktop/dist/Dots3Desktop.exe
          if-no-files-found: error
