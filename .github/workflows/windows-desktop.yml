name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - windows-desktop-app
    paths:
      - 'src/**'
      - 'py-src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.ts'
      - 'windows_app/**'
      - '.github/workflows/windows-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend into Python package
        run: yarn build

      - name: Install Python package and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name DataFormulator `
            --paths py-src `
            --add-data "py-src/data_formulator/dist;data_formulator/dist" `
            --collect-all vega_datasets `
            --collect-all litellm `
            --hidden-import flask_cors `
            windows_app/launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows_app\DataFormulator.iss"

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: DataFormulator-Windows-Portable
          path: dist/DataFormulator/

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: DataFormulator-Windows-Installer
          path: installer-output/DataFormulator-Windows-Setup.exe
